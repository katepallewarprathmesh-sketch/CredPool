[profile.default]
src = "contracts"
test = "foundry"
out = "out-forge"
cache_path = "cache-forge"
libs = ["node_modules"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 500
via_ir = true
remappings = ["@openzeppelin/=node_modules/@openzeppelin/"]

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 64
fail_on_revert = false
