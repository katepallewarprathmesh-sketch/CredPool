name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # Coverage executes the complete Hardhat suite, so do not run it twice.
      - run: npm run coverage
      - run: npm run test:issuer

  foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      # Foundry imports OpenZeppelin from node_modules. Download only that package
      # instead of installing the entire Node toolchain again in this job.
      - name: Install OpenZeppelin contracts
        run: |
          mkdir -p node_modules/@openzeppelin/contracts
          curl --fail --location --silent --show-error \
            https://registry.npmjs.org/@openzeppelin/contracts/-/contracts-5.1.0.tgz \
            | tar --extract --gzip --strip-components=1 \
                --directory=node_modules/@openzeppelin/contracts
      - run: forge test -vv

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run test:e2e
